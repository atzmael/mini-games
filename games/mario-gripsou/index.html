<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b16" />
    <title>Mario Gripsou · Mini Games</title>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="../../">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span>Mini <strong>Games</strong></span>
        </a>
        <a class="back-link" href="../../">← Retour aux jeux</a>
      </header>

      <main class="game-page">
        <section class="game-intro">
          <p class="eyebrow">Arcade · Canvas</p>
          <h1>Mario Gripsou</h1>
          <p>Saute sous le bloc pour faire sortir un maximum de pièces. Une seule mécanique, aucun chrono.</p>

          <div class="info-grid">
            <div class="info-card">
              <span class="info-label">Commande</span>
              <strong>Espace · clic · toucher</strong>
            </div>
            <div class="info-card">
              <span class="info-label">Objectif</span>
              <strong>Faire monter le score</strong>
            </div>
          </div>
        </section>

        <section class="game-stage" aria-label="Zone de jeu">
          <div id="game-surface" class="game-surface">
            <div class="game-playfield">
              <canvas id="game" aria-label="Mini-jeu de saut pour récupérer des pièces"></canvas>

              <div class="hud" aria-label="Score du jeu">
                <div class="hud-stat">
                  <span class="label">Pièces</span>
                  <strong id="score">0</strong>
                </div>
                <div class="hud-stat">
                  <span class="label">Record</span>
                  <strong id="best">0</strong>
                </div>
              </div>

              <button
                id="fullscreen-toggle"
                class="fullscreen-toggle"
                type="button"
                aria-label="Passer en plein écran"
                aria-pressed="false"
                title="Plein écran"
              ><span aria-hidden="true">⛶</span></button>

              <p class="hint"><span class="key">Espace</span> ou touche le jeu pour sauter.</p>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
